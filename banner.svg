<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#141B34"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#38D3C7"/>
    </linearGradient>
    <pattern id="hex" width="56" height="48.5" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M14 0 L42 0 L56 24.25 L42 48.5 L14 48.5 L0 24.25 Z" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#hex)"/>

  <!-- Hexagon mark -->
  <g transform="translate(150 160)">
    <polygon points="0,-82 71,-41 71,41 0,82 -71,41 -71,-41" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="url(#accent)" opacity="0.9"/>
    <text x="0" y="12" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0B1020">H</text>
  </g>

  <text x="270" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#FFFFFF" letter-spacing="4">HEXA STUDIO</text>
  <text x="272" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#C9D2F0">Software that works the way you do</text>
  <rect x="272" y="214" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="272" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8A95B8" letter-spacing="1">BUSINESS SYSTEMS  ·  MOBILE APPS  ·  WEBSITES  ·  DASHBOARDS  ·  UI/UX  ·  MVPs</text>
</svg>
